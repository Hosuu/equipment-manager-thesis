components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: API_KEY

    ApiKeyQuery:
      type: apiKey
      in: query
      name: API_KEY

  parameters:
    page:
      name: page
      in: query
      description: "The page number to retrieve."
      required: false
      schema:
        type: integer
        example: 1

    limit:
      name: limit
      in: query
      description: "The number of results per page."
      required: false
      schema:
        type: integer
        example: 10

    deviceId:
      name: deviceId
      in: query
      description: "Filter for specific deviceId."
      required: false
      schema:
        type: string
        example: abc123

    deviceIdRoute:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        example: abc123

    keyIdRoute:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        example: abc123

    userId:
      name: userId
      in: query
      description: "Filter for specific userId."
      required: false
      schema:
        type: string
        example: abc123

    userIdRoute:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: abc123

    bookingIdRoute:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        example: abc123

    query:
      name: query
      in: query
      description: "Filter for similiar names"
      required: false
      schema:
        type: string

    startDate:
      name: startDate
      in: query
      description: "Filter for records after specified date"
      required: false
      schema:
        type: string
        example: 2024-11-25T17:00:00.180Z

    endDate:
      name: endDate
      in: query
      description: "Filter for records before specified date"
      required: false
      schema:
        type: string
        example: 2024-11-28T17:00:00.180Z

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: "The email address of the user."
          example: "user@pwr.edu.pl"
        password:
          type: string
          description: "The password of the user."
          example: "securePassword123"

    UpdateBookingRequest:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
          description: "The start time for the booking (must be in the future and between 06:00 and 22:00)."
        endTime:
          type: string
          format: date-time
          description: "The end time for the booking (must be in the future and between 06:00 and 22:00)."

    CreateBookingRequest:
      type: object
      required:
        - userId
        - deviceId
        - startTime
        - endTime
      properties:
        userId:
          type: string
          description: "The ID of the user making the booking."
        deviceId:
          type: string
          description: "The ID of the device being booked."
        startTime:
          type: string
          format: date-time
          description: "The start time for the booking."
        endTime:
          type: string
          format: date-time
          description: "The end time for the booking."

    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "The name of the API key."
          minLength: 3
          example: "MyNewApiKey"

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: "The current password of the user."
        newPassword:
          type: string
          description: "The new password for the user."
          minLength: 8
          maxLength: 32

    ChangeUserNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "The new name of the user."

    CreateUserRequest:
      type: object
      required:
        - email
        - password
        - role
        - name
      properties:
        email:
          type: string
          description: "The email address of the user."
          pattern: "^[a-zA-Z0-9._%+-]+@pwr.edu.pl$"
        password:
          type: string
          description: "The password of the user."
          minLength: 8
          maxLength: 32
        role:
          type: string
          enum:
            - USER
            - ADMIN
          description: "The role of the user."
        name:
          type: string
          description: "The name of the user."
        monthlyLimit:
          type: number
          description: "Monthly limit of hours."
          default: 40

    CreateDeviceRequest:
      type: object
      required:
        - name
        - building
        - room
      properties:
        name:
          type: string
          description: "The name of the device."
        description:
          type: string
          description: "A description of the device."
        building:
          type: string
          maxLength: 32
          description: "The building where the device is located."
        room:
          type: string
          maxLength: 32
          description: "The room where the device is located."

    UpdateDeviceRequest:
      type: object
      properties:
        name:
          type: string
          description: "The updated name of the device."
        description:
          type: string
          description: "The updated description of the device."
        building:
          type: string
          maxLength: 32
          description: "The updated building location of the device."
        room:
          type: string
          maxLength: 32
          description: "The updated room location of the device."

    BasicUser:
      type: object
      properties:
        id:
          type: string
          example: "12345"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "johndoe@example.com"

    DetailedUser:
      type: object
      properties:
        id:
          type: string
          example: "12345"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "johndoe@example.com"
        role:
          type: string
          enum: ["USER", "ADMIN"]
          example: "ADMIN"
        monthlyLimit:
          type: integer
          example: 100
        createdAt:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"

    ApiKey:
      type: object
      properties:
        id:
          type: string
          example: "abc123"
        name:
          type: string
          example: "API Key 1"
        hits:
          type: integer
          example: 100
        lastUsed:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        isRevoked:
          type: boolean
          example: false

    CreatedApiKey:
      type: object
      properties:
        id:
          type: string
          example: "abc123"
        name:
          type: string
          example: "API Key 1"
        key:
          type: string
          example: "generated_api_key_123"
        hits:
          type: integer
          example: 100
        lastUsed:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        isRevoked:
          type: boolean
          example: false

    BasicDevice:
      type: object
      properties:
        id:
          type: string
          example: "dev123"
        name:
          type: string
          example: "Microscope 1"
        building:
          type: string
          example: "Building A"
        room:
          type: string
          example: "Room 101"

    DetailedDevice:
      type: object
      properties:
        id:
          type: string
          example: "dev123"
        name:
          type: string
          example: "Microscope 1"
        building:
          type: string
          example: "Building A"
        room:
          type: string
          example: "Room 101"
        description:
          type: string
          example: "A high-quality research microscope."
        updatedAt:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"

    AvailabilityTimeRange:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        endTime:
          type: string
          format: date-time
          example: "2024-11-25T16:30:00Z"

    BasicBooking:
      type: object
      properties:
        id:
          type: string
          example: "bkng123"
        user:
          $ref: "#/components/schemas/BasicUser"
        device:
          $ref: "#/components/schemas/BasicDevice"
        startTime:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        endTime:
          type: string
          format: date-time
          example: "2024-11-25T16:30:00Z"
        isCanceled:
          type: boolean
          example: false

    DetailedBooking:
      type: object
      properties:
        id:
          type: string
          example: "bkng123"
        user:
          $ref: "#/components/schemas/BasicUser"
        device:
          $ref: "#/components/schemas/BasicDevice"
        startTime:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        endTime:
          type: string
          format: date-time
          example: "2024-11-25T16:30:00Z"
        isCanceled:
          type: boolean
          example: false
        duration:
          type: integer
          example: 2
        updatedAt:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-11-25T14:30:00Z"

    DeletedId:
      type: object
      properties:
        id:
          type: string
          example: "abc123"

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 5
        totalCount:
          type: integer
          example: 50

    INVALID_JSON_BODY:
      type: object
      properties:
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "The request body is not properly formatted as JSON. Please ensure the body is valid JSON."
        code:
          type: string
          example: "INVALID_JSON_BODY"

    INVALID_TIME_RANGE:
      type: object
