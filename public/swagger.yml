openapi: "3.0.3"
info:
  title: "System Zarządzania Dostępem do Aparatury Naukowej"
  description: |
    System zarządzania czasem dostępu do aparatury naukowej pozwala na efektywne rezerwowanie urządzeń, monitorowanie dostępności oraz zarządzanie użytkownikami.
    Użytkownicy mogą rezerwować czas na urządzenia, sprawdzać dostępność w określonych terminach, a administratorzy mają możliwość zarządzania użytkownikami i kontrolowania zasobów.
    System wspiera przydzielanie czasu dostępu do aparatury, zarządzanie limitami użytkowników oraz generowanie raportów z wykorzystania urządzeń.
  version: "1.0.0"

servers:
  - url: http://localhost:3000/api

tags:
  - name: "Users"
    description: "Zarządzanie użytkownikami systemu"
  - name: "Self"
    description: "Zarządzanie akutlanie zalogowanym użytkownikiem"
  - name: "Bookings"
    description: "Rezerwacja czasu dostępu do aparatury"
  - name: "Devices"
    description: "Zarządzanie aparaturą naukową"

paths:
  /auth/login:
    post:
      summary: "User login"
      description: "Authenticates the user using their credentials and sets a cookie on success."
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        200:
          $ref: "#/components/responses/LOGIN_SUCCESS"

        400:
          description: "Bad Request - Invalid input or JSON"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"

        401:
          description: "Unauthorized - Incorrect email or password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/INVALID_CREDENTIALS"
        500:
          description: "Internal Server Error - Unexpected error occurred."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /auth/logout:
    post:
      summary: "User logout"
      description: "Signs the user out and clears their authentication cookie."
      tags:
        - Auth
      responses:
        200:
          $ref: "#/components/responses/LOGOUT_SUCCESS"

        500:
          description: "Internal Server Error - Unexpected error occurred."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /bookings:
    get:
      summary: "Retrieve Bookings"
      description: "Fetches a list of bookings. Supports filtering by various parameters such as device ID, user ID, and date range."
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/deviceId"
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/startDate"
        - $ref: "#/components/parameters/endDate"
      tags:
        - Bookings
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/BOOKINGS_RETRIEVED"

        401:
          description: "Unauthorized - User not authenticated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        500:
          description: "Internal Server Error - Unexpected error occurred."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"
    post:
      summary: "Create Booking"
      description: "Creates a new booking. Requires authentication and validates input."
      tags:
        - Bookings
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        200:
          $ref: "#/components/responses/BOOKING_CREATED"

        400:
          description: "Bad Request - Invalid input or JSON"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"
        401:
          description: "Unauthorized - User not authenticated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        403:
          $ref: "#/components/responses/MONTHLY_LIMIT_EXCEEDED"

        404:
          description: "Not Found - User or Device not found."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/USER_NOT_FOUND"
                  - $ref: "#/components/schemas/DEVICE_NOT_FOUND"
        409:
          $ref: "#/components/responses/DEVICE_UNAVAILABLE"

        500:
          description: "Internal Server Error - Unexpected error occurred."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /bookings/{bookingId}:
    get:
      summary: "Retrieve details of specific Booking"
      description: "Fetches details of a specific booking using the booking ID."
      parameters:
        - $ref: "#/components/parameters/bookingIdRoute"
      tags:
        - Bookings
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/BOOKING_FOUND"

        401:
          description: "Unauthorized - User not authenticated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        403:
          $ref: "#/components/responses/INSUFFICIENT_PERMISSIONS"

        404:
          description: "Not Found - Booking not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOOKING_NOT_FOUND"
        500:
          description: "Internal Server Error - Unexpected error occurred."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"
    put:
      summary: "Update details of specific Booking"
      description: "Updates the details of a specific booking. The request must include a valid booking ID and required fields."
      parameters:
        - $ref: "#/components/parameters/bookingIdRoute"
      tags:
        - Bookings
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        200:
          $ref: "#/components/responses/BOOKING_UPDATED"

        400:
          description: "Bad Request - The input data is invalid or improperly formatted."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"
                  - $ref: "#/components/schemas/INVALID_TIME_RANGE"

        401:
          description: "Unauthorized - The user is not authenticated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        403:
          $ref: "#/components/responses/MONTHLY_LIMIT_EXCEEDED"

        404:
          description: "Not Found - The specified booking does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOOKING_NOT_FOUND"

        409:
          $ref: "#/components/responses/DEVICE_UNAVAILABLE"

        500:
          description: "Internal Server Error - Unexpected error occurred."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UNEXPECTED_ERROR"
    delete:
      summary: "Delete specific Booking"
      description: "Deletes a specific booking identified by its ID."
      parameters:
        - $ref: "#/components/parameters/bookingIdRoute"
      tags:
        - Bookings
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/BOOKING_DELETED"

        401:
          description: "Unauthorized - The user is not authenticated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        403:
          $ref: "#/components/responses/INSUFFICIENT_PERMISSIONS"

        404:
          description: "Not Found - The specified booking does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BOOKING_NOT_FOUND"
        500:
          description: "Internal Server Error - An unexpected error occurred."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /devices:
    get:
      summary: "Retrieve Devices"
      description: "Fetches a paginated list of devices. Supports optional filtering by device ID or user ID."
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/deviceId"
        - $ref: "#/components/parameters/userId"
      tags:
        - Devices
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/DEVICES_RETRIEVED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"
    post:
      summary: "Create Device"
      description: "Allows an authorized user to create a new device by providing the necessary details in the request body."
      tags:
        - Devices
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        200:
          $ref: "#/components/responses/DEVICE_CREATED"

        400:
          description: "Bad Request - The input data is invalid, missing, or improperly formatted."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        403:
          $ref: "#/components/responses/INSUFFICIENT_PERMISSIONS"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /devices/{deviceId}:
    get:
      summary: "Retrieve details of a specific device"
      description: "Fetches detailed information about a specific device using its ID."
      parameters:
        - $ref: "#/components/parameters/deviceIdRoute"
      tags:
        - Devices
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/DEVICE_FOUND"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        404:
          description: "Device Not Found - No device exists with the provided ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DEVICE_NOT_FOUND"
        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"
    put:
      summary: "Update details of a specific device"
      description: "Updates information for an existing device by its ID. Requires valid input data in the request body."
      parameters:
        - $ref: "#/components/parameters/deviceIdRoute"
      tags:
        - Devices
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        200:
          $ref: "#/components/responses/DEVICE_UPDATED"

        400:
          description: "Bad Request - The input data is invalid, missing, or improperly formatted."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        403:
          $ref: "#/components/responses/INSUFFICIENT_PERMISSIONS"

        404:
          description: "Device Not Found - No device exists with the provided ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DEVICE_NOT_FOUND"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UNEXPECTED_ERROR"
    delete:
      summary: "Delete a specific device"
      description: "Deletes an existing device by its ID. Requires appropriate permissions."
      parameters:
        - $ref: "#/components/parameters/deviceIdRoute"
      tags:
        - Devices
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/DEVICE_DELETED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        403:
          $ref: "#/components/responses/INSUFFICIENT_PERMISSIONS"

        404:
          description: "Device Not Found - No device exists with the provided ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DEVICE_NOT_FOUND"
        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /devices/{deviceId}/availability:
    get:
      summary: "Retrieve availability time ranges for a specific device"
      description: "Fetches the available time ranges for a specific device within a specified date range. Requires user authentication."
      parameters:
        - $ref: "#/components/parameters/deviceIdRoute"
        - $ref: "#/components/parameters/startDate"
        - $ref: "#/components/parameters/endDate"
      tags:
        - Devices
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/AVAILABILITY_TIME_RANGES_RETRIEVED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        404:
          description: "Device Not Found - No device exists with the provided ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DEVICE_NOT_FOUND"
        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /devices/{deviceId}/bookings:
    get:
      summary: "Retrieve bookings for a specific device"
      description: "Fetches a paginated list of bookings for a specific device within an optional date range and with optional filters for the user ID. Requires user authentication."
      parameters:
        - $ref: "#/components/parameters/deviceIdRoute"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/startDate"
        - $ref: "#/components/parameters/endDate"
      tags:
        - Devices
        - Bookings
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/BOOKINGS_RETRIEVED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        404:
          description: "Device Not Found - No device exists with the provided ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DEVICE_NOT_FOUND"
        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /me:
    get:
      summary: "Retrieve user data for the authenticated user"
      description: "Fetches the authenticated user's information. Requires the user to be authenticated."
      tags:
        - Self
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/USER_DATA_RETRIEVED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"
    put:
      summary: "Update the authenticated user's data"
      description: "Allows the authenticated user to update their personal information, such as their username. Requires the user to be authenticated."
      tags:
        - Self
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUserNameRequest"
      responses:
        200:
          $ref: "#/components/responses/USER_UPDATED"

        400:
          description: "Bad Request - Invalid input or JSON"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /me/password:
    put:
      summary: "Change the authenticated user's password"
      description: "Allows the authenticated user to change their password. Requires the user to be authenticated and input the current password."
      tags:
        - Self
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        200:
          $ref: "#/components/responses/PASSWORD_CHANGED"

        400:
          description: "Bad Request - Invalid input or JSON"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"

        401:
          description: "Unauthorized - The user must be authenticated or the current password is incorrect."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"
                  - $ref: "#/components/schemas/INVALID_CURRENT_PASSWORD"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /me/bookings:
    get:
      summary: "Retrieve bookings for the authenticated user"
      description: "Fetches a paginated list of bookings made by the authenticated user. Supports filtering by various parameters, including device ID and date range."
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/deviceId"
        - $ref: "#/components/parameters/startDate"
        - $ref: "#/components/parameters/endDate"
      tags:
        - Self
        - Bookings
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/BOOKINGS_RETRIEVED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /me/api-keys:
    get:
      summary: "Retrieve API keys for the authenticated user"
      description: "Fetches a paginated list of API keys associated with the authenticated user. Supports filtering by query parameters."
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/query"
      tags:
        - Self
        - API-keys
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/APIKEYS_RETRIEVED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"
    post:
      summary: "Create a new API key for the authenticated user"
      description: "Generates a new API key for the authenticated user. The user must be authenticated."
      tags:
        - Self
        - API-keys
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        200:
          $ref: "#/components/responses/APIKEY_CREATED"

        400:
          description: "Bad Request - Invalid input or JSON"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /me/api-keys/{keyId}:
    delete:
      summary: "Delete a specific API key for the authenticated user"
      description: "Deletes an API key associated with the authenticated user. The user must be authenticated, and the API key must exist."
      parameters:
        - $ref: "#/components/parameters/keyIdRoute"
      tags:
        - Self
        - API-keys
      security:
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        200:
          $ref: "#/components/responses/APIKEY_DELETED"

        400:
          description: "Bad Request - Invalid input or JSON"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/INVALID_DATA"
                  - $ref: "#/components/schemas/INVALID_JSON_BODY"
                  - $ref: "#/components/schemas/NO_DATA_PROVIDED"

        401:
          description: "Unauthorized - The user must be authenticated to access this endpoint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USER_NOT_AUTHENTICATED"

        404:
          description: "Not Found - The specified API key does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKEY_NOT_FOUND"

        500:
          description: "Internal Server Error - An unexpected issue occurred while processing the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UNEXPECTED_ERROR"

  /users:
    get:
      summary: "Retrieve Users"
